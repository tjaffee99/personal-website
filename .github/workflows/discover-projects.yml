name: Discover new projects

# Looks for new *.theojaffee.net subdomains, adds them to projects.json, and
# republishes projects.theojaffee.net.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: discover-projects
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look for new subdomains
        id: discover
        run: node scripts/discover-projects.mjs

      - name: Commit changes
        id: commit
        if: steps.discover.outputs.added != '0'
        env:
          MESSAGE: ${{ steps.discover.outputs.message }}
        run: |
          git add projects.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git commit -m "$MESSAGE"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN may not trigger a Pages build on their own.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
