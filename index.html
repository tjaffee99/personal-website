<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects · Theo Jaffee</title>
    <meta name="description" content="Things Theo Jaffee has made.">
    <meta name="theme-color" content="#f2efe8">
    <link rel="canonical" href="https://projects.theojaffee.net/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://projects.theojaffee.net/">
    <meta property="og:title" content="Projects · Theo Jaffee">
    <meta property="og:description" content="Things Theo Jaffee has made.">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="https://theojaffee.net/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --paper: #f2efe8;
            --ink: #18211d;
            --muted: color-mix(in srgb, var(--ink) 62%, var(--paper));
            --line: color-mix(in srgb, var(--ink) 12%, var(--paper));
            --accent: #b75036;
            --serif: "Iowan Old Style", Baskerville, "Times New Roman", Times, serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        html { color-scheme: light; background: var(--paper); }

        body {
            margin: 0;
            min-width: 320px;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--serif);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(100% - 4rem, 45rem);
            margin-inline: auto;
            padding-block: clamp(4.5rem, 11vh, 8.25rem);
        }

        h1 {
            margin: 0 0 clamp(2rem, 4.5vh, 3.25rem);
            font-size: clamp(2.15rem, 3.25vw, 3.5rem);
            font-weight: 400;
            line-height: 1.04;
            letter-spacing: -0.038em;
        }

        ul { margin: 0; padding: 0; list-style: none; }

        li + li { margin-top: 1.75rem; }

        .project {
            display: grid;
            grid-template-columns: 11rem minmax(0, 1fr);
            gap: 1.5rem;
            align-items: start;
            color: inherit;
            text-decoration: none;
        }

        .thumb {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--line);
        }

        .name {
            display: block;
            font-size: clamp(1.35rem, 1.75vw, 1.8rem);
            line-height: 1.2;
            letter-spacing: -0.014em;
            text-decoration-line: underline;
            text-decoration-color: var(--accent);
            text-decoration-thickness: 1px;
            text-underline-offset: 0.16em;
            transition: color 0.18s, text-decoration-thickness 0.18s;
        }

        .host {
            display: block;
            margin-top: 0.45rem;
            font: 0.85rem/1.3 var(--mono);
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .host b { font-weight: 400; color: var(--accent); }

        .description {
            display: block;
            margin-top: 0.4rem;
            font-size: 1.05rem;
            line-height: 1.45;
            color: var(--muted);
        }

        .project:hover .name { color: var(--accent); text-decoration-thickness: 2px; }
        .project:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }

        @media (max-width: 520px) {
            main { width: calc(100% - 2rem); padding-block: 3rem 3.5rem; }
            h1 { margin-bottom: 2rem; font-size: clamp(2rem, 10vw, 2.65rem); }
            .project { grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1rem; }
            .name { font-size: 1.19rem; }
            .host { font-size: 0.75rem; }
            .description { font-size: 0.95rem; }
        }

        @media (prefers-reduced-motion: reduce) { .name { transition: none; } }
    </style>
</head>
<body>
    <main>
        <h1>Projects</h1>
        <ul id="projects"></ul>
    </main>
    <script>
        // The list lives in projects.json, which a GitHub Action keeps up to date.
        const DOMAIN = '.theojaffee.net';
        const list = document.getElementById('projects');

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text) node.textContent = text;
            return node;
        }

        function item(project) {
            const link = el('a', 'project');
            link.href = project.url;
            link.target = '_blank';
            link.rel = 'noopener';

            const image = /^previews\/[\w.-]+$/.test(project.image ?? '') ? project.image : null;
            const thumb = el(image ? 'img' : 'span', 'thumb');
            if (image) {
                thumb.src = image;
                thumb.alt = '';
                thumb.width = 640;
                thumb.height = 400;
                thumb.loading = 'lazy';
            }

            // "weather.theojaffee.net" with "weather" highlighted.
            const host = new URL(project.url).hostname;
            const hostLine = el('span', 'host');
            if (host.endsWith(DOMAIN)) {
                hostLine.append(el('b', '', host.slice(0, -DOMAIN.length)), DOMAIN);
            } else {
                hostLine.textContent = host;
            }

            const text = el('span');
            text.append(el('span', 'name', project.name), hostLine);
            if (project.description) text.append(el('span', 'description', project.description));

            link.append(thumb, text);
            const li = el('li');
            li.append(link);
            return li;
        }

        fetch('projects.json', { cache: 'no-cache' })
            .then((response) => response.json())
            .then(({ projects }) => {
                const shown = projects
                    .filter((p) => !p.hidden && /^https:\/\//.test(p.url))
                    .sort((a, b) => (b.launched ?? '').localeCompare(a.launched ?? ''));
                list.replaceChildren(...shown.map(item));
            })
            .catch((error) => console.error('Could not load projects.json', error));
    </script>
</body>
</html>
